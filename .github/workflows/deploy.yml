name: Build & deploy to reg.ru

on:
  push:
    branches: [main]
  workflow_dispatch:

# Не даём двум деплоям идти одновременно (иначе FTP перетрёт друг друга)
concurrency:
  group: deploy-regru
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # prebuild (genblur) + next build -> статика в out/
      - name: Build static site
        run: npm run build

      # FTP-пользователь смотрит в корень сайта (/www/petrafanasyev.com),
      # поэтому server-dir = ./ . Первый запуск зальёт всё, дальше — только изменения.
      - name: Upload to reg.ru via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./out/
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
