name: Build & deploy to reg.ru

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-regru
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # prebuild (genblur) + next build -> статика в out/
      - name: Build static site
        run: npm run build

      # FTPS: TLS обязателен на управляющем канале (логин/пароль шифруются).
      # Канал данных не шифруем — reg.ru его не поднимает (ошибка 425),
      # а файлы сайта и так публичные, секретов в них нет.
      # Пользователь u3613093_deploy смотрит в /www/petrafanasyev.com,
      # поэтому заливаем в ./
      - name: Upload to reg.ru (FTPS, encrypted login)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          lftp -c "
            set cmd:fail-exit true;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data false;
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            set net:timeout 20;
            set net:max-retries 3;
            open -u '$FTP_USER','$FTP_PASSWORD' '$FTP_HOST';
            mirror --reverse --verbose --parallel=4 out/ ./;
          "
